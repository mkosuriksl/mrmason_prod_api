

name: Deploy MrMason Development-develop branch

on:
  push:
    branches:
      - develop

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout develop
        uses: actions/checkout@v4

      # ==========================================
      # JAVA 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      # ==========================================
      # BUILD
      # ==========================================
      - name: Build application
        working-directory: ./mrmason
        run: |
          echo "======================================"
          echo "Building MrMason DEV application"
          echo "======================================"

          mvn clean package -DskipTests

      # ==========================================
      # VERIFY LOCAL JAR
      # ==========================================
      - name: Verify JAR
        working-directory: ./mrmason
        run: |
          echo "======================================"
          echo "Verifying generated JAR"
          echo "======================================"

          ls -lh target/

          test -f target/mrmason-0.0.1-SNAPSHOT.jar

          echo "JAR found successfully"

          echo "======================================"
          echo "JAR contents verification"
          echo "======================================"

          jar tf target/mrmason-0.0.1-SNAPSHOT.jar | \
            grep "BOOT-INF/classes/com/application/mrmason/MrmasonApplication.class"

          echo "Application class found successfully"

      # ==========================================
      # COPY JAR TO EC2
      # ==========================================
      - name: Copy JAR to Development EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          source: "mrmason/target/mrmason-0.0.1-SNAPSHOT.jar"
          target: "/opt/mrmason-dev/"
          strip_components: 1

      # ==========================================
      # DEPLOY / RESTART
      # ==========================================
      - name: Restart Development Application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.DEV_EC2_SSH_KEY }}

          script: |

            set -e

            echo "======================================"
            echo "MrMason DEV Deployment"
            echo "======================================"

            # --------------------------------------
            # VARIABLES
            # --------------------------------------

            APP_DIR="/opt/mrmason-dev"
            NEW_JAR="$APP_DIR/mrmason-0.0.1-SNAPSHOT.jar"
            APP_JAR="$APP_DIR/mrmason.jar"
            SERVICE="mrmason-dev"

            # --------------------------------------
            # VERIFY UPLOADED JAR
            # --------------------------------------

            echo "======================================"
            echo "Verifying uploaded JAR"
            echo "======================================"

            if [ ! -f "$NEW_JAR" ]; then
              echo "ERROR: Uploaded JAR not found:"
              echo "$NEW_JAR"
              exit 1
            fi

            ls -lh "$NEW_JAR"

            echo "Uploaded JAR found"

            # --------------------------------------
            # VERIFY JAR CONTENT
            # --------------------------------------

            echo "======================================"
            echo "Verifying deployed JAR"
            echo "======================================"

            jar tf "$NEW_JAR" | \
              grep "BOOT-INF/classes/com/application/mrmason/MrmasonApplication.class"

            echo "Application class found in deployed JAR"

            # --------------------------------------
            # STOP SERVICE
            # --------------------------------------

            echo "======================================"
            echo "Stopping MrMason DEV service"
            echo "======================================"

            sudo systemctl stop "$SERVICE"

            # --------------------------------------
            # VERIFY SERVICE STOPPED
            # --------------------------------------

            echo "Checking service stopped..."

            if sudo systemctl is-active --quiet "$SERVICE"; then
              echo "ERROR: MrMason DEV service is still running"
              exit 1
            fi

            echo "Service stopped successfully"

            # --------------------------------------
            # BACKUP CURRENT JAR
            # --------------------------------------

            echo "======================================"
            echo "Backing up current JAR"
            echo "======================================"

            if [ -f "$APP_JAR" ]; then

              TIMESTAMP=$(date +%Y%m%d%H%M%S)

              cp "$APP_JAR" \
                 "$APP_DIR/mrmason.jar.backup.$TIMESTAMP"

              echo "Backup created:"
              echo "$APP_DIR/mrmason.jar.backup.$TIMESTAMP"

            else

              echo "No existing application JAR found"

            fi

            # --------------------------------------
            # REPLACE JAR
            # --------------------------------------

            echo "======================================"
            echo "Replacing application JAR"
            echo "======================================"

            mv "$NEW_JAR" "$APP_JAR"

            chmod 644 "$APP_JAR"

            ls -lh "$APP_JAR"

            echo "Application JAR replaced successfully"

            # --------------------------------------
            # START SERVICE
            # --------------------------------------

            echo "======================================"
            echo "Starting MrMason DEV service"
            echo "======================================"

            sudo systemctl start "$SERVICE"

            # --------------------------------------
            # WAIT FOR SYSTEMD
            # --------------------------------------

            echo "======================================"
            echo "Waiting for application startup"
            echo "======================================"

            sleep 3

            # --------------------------------------
            # CHECK SYSTEMD STATUS
            # --------------------------------------

            echo "======================================"
            echo "Checking service status"
            echo "======================================"

            if ! sudo systemctl is-active --quiet "$SERVICE"; then

              echo "ERROR: MrMason DEV service failed to start"

              echo "======================================"
              echo "SYSTEMD STATUS"
              echo "======================================"

              sudo systemctl status "$SERVICE" \
                --no-pager \
                -l || true

              echo "======================================"
              echo "RECENT APPLICATION LOGS"
              echo "======================================"

              sudo journalctl \
                -u "$SERVICE" \
                -n 100 \
                --no-pager || true

              exit 1

            fi

            echo "Service is ACTIVE"

            # --------------------------------------
            # WAIT FOR PORT 8080
            # --------------------------------------

            echo "======================================"
            echo "Waiting for port 8080"
            echo "======================================"

            PORT_READY=false

            for i in {1..30}; do

              if sudo ss -lntp | grep -q ':8080'; then

                echo "Port 8080 is listening"

                PORT_READY=true

                break

              fi

              echo "Attempt $i/30: Port 8080 not ready yet..."

              sleep 2

            done

            # --------------------------------------
            # PORT FAILURE
            # --------------------------------------

            if [ "$PORT_READY" != "true" ]; then

              echo "======================================"
              echo "ERROR: Port 8080 did not become available"
              echo "======================================"

              echo "======================================"
              echo "SYSTEMD STATUS"
              echo "======================================"

              sudo systemctl status "$SERVICE" \
                --no-pager \
                -l || true

              echo "======================================"
              echo "APPLICATION LOGS"
              echo "======================================"

              sudo journalctl \
                -u "$SERVICE" \
                -n 150 \
                --no-pager || true

              exit 1

            fi

            # --------------------------------------
            # VERIFY JAVA PROCESS
            # --------------------------------------

            echo "======================================"
            echo "Checking Java process"
            echo "======================================"

            sudo ss -lntp | grep ':8080'

            # --------------------------------------
            # TEST APPLICATION HTTP RESPONSE
            # --------------------------------------

            echo "======================================"
            echo "Testing application response"
            echo "======================================"

            HTTP_STATUS=$(curl \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              --max-time 10 \
              http://localhost:8080/ || true)

            echo "HTTP status: $HTTP_STATUS"

            # 000 means curl could not connect.
            # 401/403 are acceptable because the root
            # endpoint is protected by Spring Security.

            if [ "$HTTP_STATUS" = "000" ]; then

              echo "======================================"
              echo "ERROR: Application is not responding"
              echo "======================================"

              sudo journalctl \
                -u "$SERVICE" \
                -n 150 \
                --no-pager || true

              exit 1

            fi

            echo "Application is responding"

            # --------------------------------------
            # FINAL SERVICE CHECK
            # --------------------------------------

            echo "======================================"
            echo "Final service status"
            echo "======================================"

            sudo systemctl is-active "$SERVICE"

            echo "======================================"
            echo "MrMason DEV deployment successful"
            echo "======================================"

            echo "Service : $SERVICE"
            echo "Port    : 8080"
            echo "HTTP    : $HTTP_STATUS"
            echo "JAR     : $APP_JAR"

            echo "======================================"



# Manual deployment enabled for develop
