
name: Deploy MrMason Development develop branch

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      - name: Build application
        run: mvn clean package -DskipTests

      - name: Verify JAR
        run: |
          ls -lh target/
          test -f target/mrmason-0.0.1-SNAPSHOT.jar

      - name: Copy JAR to Development EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          source: "target/mrmason-0.0.1-SNAPSHOT.jar"
          target: "/opt/mrmason-dev/"
          strip_components: 1

      - name: Restart Development Application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            echo "Stopping MrMason DEV service..."
            sudo systemctl stop mrmason-dev

            echo "Replacing application JAR..."
            mv /opt/mrmason-dev/mrmason-0.0.1-SNAPSHOT.jar \
               /opt/mrmason-dev/mrmason.jar

            echo "Starting MrMason DEV service..."
            sudo systemctl start mrmason-dev

            echo "Waiting for application startup..."
            sleep 15

            echo "Checking service..."
            sudo systemctl is-active --quiet mrmason-dev

            echo "Checking port 8080..."
            sudo ss -lntp | grep ':8080'

            echo "======================================"
            echo "MrMason DEV deployment successful"
            echo "======================================"

      - name: Diagnose EC2 SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            echo "======================================"
            echo "SSH SERVICE"
            echo "======================================"
            sudo systemctl status sshd --no-pager -l || true

            echo "======================================"
            echo "PORT 22"
            echo "======================================"
            sudo ss -lntp | grep ':22' || true

            echo "======================================"
            echo "MAX STARTUPS"
            echo "======================================"
            sudo sshd -T | grep maxstartups || true

            echo "======================================"
            echo "SSH LOGS - LAST 1 HOUR"
            echo "======================================"
            sudo journalctl -u sshd --since "1 hour ago" --no-pager || true

            echo "======================================"
            echo "SECURE LOG"
            echo "======================================"
            sudo tail -n 100 /var/log/secure || true

            echo "======================================"
            echo "DIAGNOSTIC COMPLETE"
            echo "======================================"

# Manual deployment enabled for develop