
name: Deploy MrMason Development

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      - name: Build application
        working-directory: mrmason
        run: mvn clean package -DskipTests

      - name: Verify JAR
        run: |
          ls -lh mrmason/target/
          test -f mrmason/target/mrmason-0.0.1-SNAPSHOT.jar

    #   - name: Verify StoreMasterController
    #     run: |
    #       jar tf mrmason/target/mrmason-0.0.1-SNAPSHOT.jar | grep "StoreMasterController.class"

      - name: Copy JAR to Development EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          source: "mrmason/target/mrmason-0.0.1-SNAPSHOT.jar"
          target: "/opt/mrmason-dev/"
          strip_components: 2

      - name: Restart Development Application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -e

            echo "Stopping MrMason DEV service..."
            sudo systemctl stop mrmason-dev

            echo "Checking copied JAR..."
            ls -lh /opt/mrmason-dev/mrmason-0.0.1-SNAPSHOT.jar

            echo "Replacing application JAR..."
            mv /opt/mrmason-dev/mrmason-0.0.1-SNAPSHOT.jar \
               /opt/mrmason-dev/mrmason.jar

            echo "Starting MrMason DEV service..."
            sudo systemctl start mrmason-dev

            echo "Waiting for application startup..."
            sleep 15

            echo "Checking service..."
            sudo systemctl is-active --quiet mrmason-dev

            echo "Checking port 8080..."
            sudo ss -lntp | grep ':8080'

            echo "======================================"
            echo "MrMason DEV deployment successful"
            echo "======================================"




            set -e

            echo "Stopping MrMason DEV service..."
            sudo systemctl stop mrmason-dev

            echo "Checking copied JAR..."
            ls -lh /opt/mrmason-dev/mrmason-0.0.1-SNAPSHOT.jar

            echo "Replacing application JAR..."
            mv /opt/mrmason-dev/mrmason-0.0.1-SNAPSHOT.jar \
            /opt/mrmason-dev/mrmason.jar

            echo "Starting MrMason DEV service..."
            sudo systemctl start mrmason-dev

            echo "Waiting for application startup..."

            PORT_READY=false

            for i in {1..12}; do
                if sudo ss -lntp | grep -q ':8080'; then
                    echo "Port 8080 is listening."
                    PORT_READY=true
                    break
                fi

               echo "Waiting for port 8080... attempt $i/12"
               sleep 5
            done

            if [ "$PORT_READY" != "true" ]; then
              echo "ERROR: MrMason DEV did not start on port 8080"
              sudo systemctl status mrmason-dev --no-pager -l
              sudo journalctl -u mrmason-dev -n 100 --no-pager
              exit 1
            fi

            echo "Checking service..."
            sudo systemctl is-active --quiet mrmason-dev

            echo "======================================"
            echo "MrMason DEV deployment successful"
            echo "======================================"